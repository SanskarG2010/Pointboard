<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Progress</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 32px 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #fff;
    }
    .container {
        max-width: 1200px;
        margin: auto;
    }
    h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 700;
    }
    .table-wrap {
        overflow-x: auto;
        border: 1px solid #333;
        border-radius: 10px;
    }
    table {
        width: 100%;
        min-width: 850px;
        border-collapse: collapse;
        background: #000;
    }
    th, td {
        padding: 15px 14px;
        border-bottom: 1px solid #333;
        text-align: center;
        white-space: nowrap;
    }
    th {
        background: #111;
        font-weight: 700;
    }
    th:first-child, td:first-child {
        text-align: left;
        font-weight: 600;
        position: sticky;
        left: 0;
        background: #000;
    }
    th:first-child {
        background: #111;
    }
    .total-row td {
        font-weight: 700;
        border-bottom: 2px solid #fff;
    }
    .maximum {
        font-weight: 700;
    }
    tr:last-child td {
        border-bottom: none;
    }
    @media (max-width: 700px) {
        body { padding: 20px 10px; }
        h1 { font-size: 22px; }
        th, td { padding: 12px 10px; }
    }
</style>
</head>
